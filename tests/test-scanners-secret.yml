name: Test scanners option with secret scanning
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Trivy with secret scanner only
        id: action
        uses: .
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-secrets.json
          exit-code: '0'
          scanners: 'secret'

      - name: Assert output file created and is valid JSON
        run: |
          echo "Checking for trivy-secrets.json..."
          if [ ! -f "trivy-secrets.json" ]; then
            echo "FAIL: trivy-secrets.json was not created"
            exit 1
          fi
          echo "File exists, checking it is valid JSON..."
          if ! python3 -c "import json, sys; json.load(open('trivy-secrets.json'))" 2>/dev/null; then
            echo "FAIL: trivy-secrets.json is not valid JSON"
            cat trivy-secrets.json
            exit 1
          fi
          echo "PASS: Trivy ran with secret scanner and produced valid JSON output"
