name: Test tf-vars input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create terraform files for scanning
        run: |
          mkdir -p /tmp/scan-tf
          cat > /tmp/scan-tf/main.tf << 'EOF'
          variable "bucket_name" {
            type = string
          }
          resource "aws_s3_bucket" "example" {
            bucket = var.bucket_name
          }
          EOF
          cat > /tmp/scan-tf/terraform.tfvars << 'EOF'
          bucket_name = "my-test-bucket"
          EOF

      - id: action
        uses: .
        with:
          scan-type: config
          scan-ref: /tmp/scan-tf
          format: table
          exit-code: '0'
          severity: CRITICAL
          hide-progress: 'true'
          tf-vars: /tmp/scan-tf/terraform.tfvars

      - name: Assert action completed successfully with tf-vars
        run: |
          echo "PASS: Trivy config scan with tf-vars input completed without error"
