name: Test tf-vars input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create terraform fixture files
        run: |
          mkdir -p /tmp/tf-test
          cat > /tmp/tf-test/main.tf << 'EOF'
          variable "environment" {
            description = "Environment name"
            type        = string
            default     = "dev"
          }

          resource "null_resource" "example" {
            triggers = {
              env = var.environment
            }
          }
          EOF
          cat > /tmp/tf-test/test.tfvars << 'EOF'
          environment = "test"
          EOF
          echo "Created terraform fixture files"

      - name: Run Trivy with tf-vars input
        id: action
        uses: .
        with:
          scan-type: config
          scan-ref: /tmp/tf-test
          tf-vars: /tmp/tf-test/test.tfvars
          exit-code: '0'
          format: table

      - name: Assert scan completed successfully
        run: |
          echo "PASS: Trivy config scan with tf-vars input completed without error"
