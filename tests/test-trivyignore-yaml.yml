name: Test trivyignore YAML file support
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Trivy with YAML trivyignore file
        id: action
        uses: .
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          trivyignores: 'tests/fixtures/.trivyignore.yaml'

      - name: Assert scan completed with YAML trivyignore
        run: |
          echo "PASS: Trivy scan completed with YAML trivyignore file"
