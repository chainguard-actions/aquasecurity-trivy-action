name: Test severity filtering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Trivy with CRITICAL-only severity filter
        id: action
        uses: .
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-critical.json
          exit-code: '0'
          severity: 'CRITICAL'
          scanners: 'vuln'

      - name: Assert output file created and severity filter applied
        run: |
          echo "Checking for trivy-critical.json..."
          if [ ! -f "trivy-critical.json" ]; then
            echo "FAIL: trivy-critical.json was not created"
            exit 1
          fi
          echo "File exists, checking it is valid JSON..."
          if ! python3 -c "import json, sys; json.load(open('trivy-critical.json'))" 2>/dev/null; then
            echo "FAIL: trivy-critical.json is not valid JSON"
            cat trivy-critical.json
            exit 1
          fi
          echo "PASS: Trivy ran with CRITICAL severity filter and produced valid JSON output"
