name: Test basic filesystem scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Trivy filesystem scan (basic)
        id: action
        uses: .
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Assert scan completed successfully
        run: |
          echo "PASS: Trivy filesystem scan completed without error"
