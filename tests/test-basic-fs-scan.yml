name: Test basic filesystem scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple test file to scan
        run: |
          mkdir -p /tmp/scan-target
          echo '{"name":"test","version":"1.0.0"}' > /tmp/scan-target/package.json

      - id: action
        uses: .
        with:
          scan-type: fs
          scan-ref: /tmp/scan-target
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
          hide-progress: 'true'

      - name: Assert action completed successfully
        run: |
          echo "PASS: Trivy filesystem scan completed without error"
