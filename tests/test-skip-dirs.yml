name: Test skip-dirs option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Trivy with skip-dirs option
        id: action
        uses: .
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-skipdirs.json
          exit-code: '0'
          skip-dirs: '.git,node_modules'
          severity: 'CRITICAL,HIGH'

      - name: Assert output file created and is valid JSON
        run: |
          echo "Checking for trivy-skipdirs.json..."
          if [ ! -f "trivy-skipdirs.json" ]; then
            echo "FAIL: trivy-skipdirs.json was not created"
            exit 1
          fi
          echo "File exists, checking it is valid JSON..."
          if ! python3 -c "import json, sys; json.load(open('trivy-skipdirs.json'))" 2>/dev/null; then
            echo "FAIL: trivy-skipdirs.json is not valid JSON"
            cat trivy-skipdirs.json
            exit 1
          fi
          echo "PASS: Trivy ran with skip-dirs option and produced valid JSON output"
