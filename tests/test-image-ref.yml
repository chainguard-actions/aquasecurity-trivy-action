name: Test image-ref input (backward compatibility)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          scan-type: image
          image-ref: alpine:3.18
          format: table
          exit-code: '0'
          severity: CRITICAL
          hide-progress: 'true'

      - name: Assert action completed successfully using image-ref
        run: |
          echo "PASS: Trivy image scan using image-ref (backward compat) completed without error"
