name: Test SARIF output with limit-severities-for-sarif and github-pat
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Trivy with SARIF output
        id: action
        uses: .
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          limit-severities-for-sarif: 'true'
          severity: HIGH,CRITICAL
          github-pat: ${{ github.token }}
          hide-progress: 'true'
          cache: 'false'
      - name: Assert SARIF output file was created
        run: |
          echo "Checking SARIF output file..."
          if [ ! -f trivy-results.sarif ]; then
            echo "FAIL: trivy-results.sarif was not created"
            exit 1
          fi
          echo "PASS: trivy-results.sarif exists"
