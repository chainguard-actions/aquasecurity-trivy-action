name: Test exit-code option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Trivy with exit-code=0 (always succeed)
        id: action
        uses: .
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-exitcode.json
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'

      - name: Assert scan completed with exit-code=0
        run: |
          echo "Checking for trivy-exitcode.json..."
          if [ ! -f "trivy-exitcode.json" ]; then
            echo "FAIL: trivy-exitcode.json was not created"
            exit 1
          fi
          echo "File exists, checking it is valid JSON..."
          if ! python3 -c "import json, sys; json.load(open('trivy-exitcode.json'))" 2>/dev/null; then
            echo "FAIL: trivy-exitcode.json is not valid JSON"
            cat trivy-exitcode.json
            exit 1
          fi
          echo "PASS: Trivy ran with exit-code=0 and produced valid JSON output"
