name: Test github-pat input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Trivy with github-pat input (github format)
        id: action
        uses: .
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: github
          output: trivy-sbom.json
          exit-code: '0'
          severity: 'CRITICAL'
          github-pat: ${{ github.token }}

      - name: Assert action ran with github-pat input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed or fail depending on whether the SBOM upload
          # to the sentinel GITHUB_REPOSITORY succeeds. Either outcome is acceptable
          # as long as the action ran (not skipped).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with github-pat input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with github-pat input (failed gracefully on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
