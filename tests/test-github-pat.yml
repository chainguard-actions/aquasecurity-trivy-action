name: Test github-pat input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple test directory to scan
        run: |
          mkdir -p /tmp/scan-github-pat
          echo '{"name":"github-pat-test","version":"1.0.0"}' > /tmp/scan-github-pat/package.json

      - id: action
        uses: .
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: /tmp/scan-github-pat
          format: github
          output: /tmp/trivy-sbom.json
          exit-code: '0'
          severity: HIGH,CRITICAL
          hide-progress: 'true'
          github-pat: ${{ github.token }}

      - name: Assert action ran with github-pat input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with github-pat"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo for dependency snapshot API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
