name: Test hide-progress option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Trivy with hide-progress=true
        id: action
        uses: .
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          hide-progress: 'true'
          severity: 'CRITICAL,HIGH'

      - name: Assert scan completed with hidden progress
        run: |
          echo "PASS: Trivy scan completed with hide-progress=true"
