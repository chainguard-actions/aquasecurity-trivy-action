name: Test timeout option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Trivy with custom timeout
        id: action
        uses: .
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          timeout: '10m'
          severity: 'CRITICAL'

      - name: Assert scan completed with custom timeout
        run: |
          echo "PASS: Trivy scan completed with custom timeout of 10m"
