name: Test docker-host input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple test directory to scan
        run: |
          mkdir -p /tmp/scan-docker-host
          echo '{"name":"docker-host-test","version":"1.0.0"}' > /tmp/scan-docker-host/package.json

      - id: action
        uses: .
        with:
          scan-type: fs
          scan-ref: /tmp/scan-docker-host
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
          hide-progress: 'true'
          docker-host: unix:///var/run/docker.sock

      - name: Assert action completed successfully with docker-host
        run: |
          echo "PASS: Trivy scan with docker-host input completed without error"
