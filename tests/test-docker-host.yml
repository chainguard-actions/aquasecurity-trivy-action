name: Test docker-host input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Trivy filesystem scan with docker-host input set
        id: action
        uses: .
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          severity: 'CRITICAL'
          docker-host: 'unix:///var/run/docker.sock'

      - name: Assert scan completed successfully
        run: |
          echo "PASS: Trivy filesystem scan with docker-host input completed without error"
