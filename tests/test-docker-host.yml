name: Test docker-host input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Trivy with docker-host specified
        id: action
        uses: .
        with:
          scan-type: image
          image-ref: alpine:3.18
          docker-host: unix:///var/run/docker.sock
          exit-code: '0'
          hide-progress: 'true'
          severity: CRITICAL
          ignore-unfixed: 'true'
          cache: 'false'
      - name: Assert docker-host scan completed
        run: |
          echo "Trivy image scan with docker-host completed successfully"
          echo "PASS"
