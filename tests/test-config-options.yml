name: Test trivy-config and tf-vars options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Trivy with config file and tf-vars
        id: action
        uses: .
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: ${{ github.workspace }}/actions/hardened/aquasecurity--trivy-action/v0.35.0/tests/fixtures/trivy.yaml
          tf-vars: ${{ github.workspace }}/actions/hardened/aquasecurity--trivy-action/v0.35.0/tests/fixtures/test.tfvars
          hide-progress: 'true'
          cache: 'false'
      - name: Assert config options scan completed
        run: |
          echo "Trivy scan with trivy-config and tf-vars completed successfully"
          echo "PASS"
